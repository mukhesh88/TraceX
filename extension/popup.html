<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TraceX Protection</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #070b14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }
    .logo span {
      color: #38bdf8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: bold;
      font-family: monospace;
      color: #34d399;
      background: rgba(6, 78, 59, 0.4);
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid #059669;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 16px;
      font-weight: bold;
      font-family: monospace;
      color: #38bdf8;
    }
    .stat-lbl {
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .btn-dashboard {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-dashboard:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Trace<span>X</span> Edge</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>ACTIVE</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="benignCount">--</div>
      <div class="stat-lbl">Cached Benign</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="bypassedCount">--</div>
      <div class="stat-lbl">Bypassed</div>
    </div>
  </div>

  <button class="btn-dashboard" id="openDashboardBtn">Open Sandbox Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
